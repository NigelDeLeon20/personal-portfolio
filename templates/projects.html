{% extends "base.html" %}

{% block title %}Projects{% endblock %}
{% block content %}
    <h1>Projects</h1>
    <p>My projects: </p>
    {% for project in projects %}
        <div>
            <h2>{{ project.title }}</h2>
            <p>{{ project.description }}</p>
            <a href="{{ project.repo_url }}">View on GitHub</a>
        </div>
    {% endfor %}
{% endblock %}
